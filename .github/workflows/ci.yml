name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props -Raw
          $declared = @(
              $properties.SelectNodes('/Project/PropertyGroup/VersionPrefix') |
                  ForEach-Object { [string]$_.InnerText } |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($declared.Count -ne 1) {
              throw 'Directory.Build.props must contain exactly one VersionPrefix.'
          }
          if ($declared[0] -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "VersionPrefix must use MAJOR.MINOR.PATCH form: $($declared[0])"
          }
          "version=$($declared[0])" >> $env:GITHUB_OUTPUT

      - name: Restore local tools
        shell: pwsh
        run: dotnet tool restore --disable-parallel

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore Pact.slnx --disable-parallel --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build Pact.slnx --no-restore -m:2 -nr:false -v q -p:BuildInParallel=false

      - name: Run test projects sequentially
        shell: pwsh
        run: |
          dotnet test tests/Pact.Core.Tests/Pact.Core.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.Infrastructure.Tests/Pact.Infrastructure.Tests.csproj --no-build --no-restore -m:1 -nr:false --filter "TestCategory!=NativeIntegration" -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.Presentation.Tests/Pact.Presentation.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.App.Avalonia.Tests/Pact.App.Avalonia.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.Updater.Tests/Pact.Updater.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run bundled ConPTY integration tests
        shell: pwsh
        run: |
          dotnet test tests/Pact.Infrastructure.Tests/Pact.Infrastructure.Tests.csproj --no-build --no-restore -m:1 -nr:false --filter "TestCategory=NativeIntegration" -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate native WebView evidence contract
        shell: pwsh
        run: |
          ./tools/Invoke-NativeWebViewGate.ps1 -SelfTest
          Write-Output "Native WebView gate: NOT RUN (interactive gate)"

      - name: Verify vendored xterm assets
        shell: pwsh
        run: ./tools/Sync-XtermAssets.ps1 -Verify

      - name: Validate public documentation boundary
        shell: pwsh
        run: |
          ./tools/Test-MarkdownLinks.ps1 -SelfTest
          ./tools/Test-MarkdownLinks.ps1
          ./tests/powershell/Test-PublicTree.Tests.ps1
          ./tools/Test-PublicTree.ps1
          ./tests/powershell/PactSbom.Tests.ps1 -ModulePath ./tools/PactSbom.psm1 -TemporaryRoot ./artifacts/sbom-selftest
          ./tests/powershell/PactReleaseComposition.Tests.ps1 -ScriptPath ./tools/Complete-PactRelease.ps1 -TemporaryRoot ./artifacts/release-composition-selftest
          ./tests/powershell/PactInstalledSmoke.Tests.ps1 -ScriptPath ./tools/Test-PactInstaller.ps1

      - name: Validate workflow contracts
        shell: pwsh
        run: |
          ./tools/Test-WorkflowContracts.ps1 -SelfTest
          ./tools/Test-WorkflowContracts.ps1 -CiWorkflow .github/workflows/ci.yml

      - name: Install pinned Inno Setup toolchain
        id: inno
        shell: pwsh
        run: |
          $compiler = ./tools/Install-InnoSetup.ps1 -DestinationDirectory "$env:RUNNER_TEMP/pact-inno-7.1.0" | Select-Object -Last 1
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Validate installer builder
        shell: pwsh
        run: ./tests/powershell/PactInstaller.Tests.ps1 -BuildScriptPath ./tools/Build-PactInstaller.ps1 -CompilerPath '${{ steps.inno.outputs.compiler }}' -DependencyCacheDirectory ./artifacts/installer-dependencies -TemporaryRoot ./artifacts/installer-selftest

      - name: Package unsigned release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          ./tools/Publish-Pact.ps1 -Version $version -RepositoryUrl "${{ github.server_url }}/${{ github.repository }}" -AuthenticodeStatus Unsigned -CompilerPath '${{ steps.inno.outputs.compiler }}' -DependencyCacheDirectory ./artifacts/installer-dependencies

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          ./tools/Test-PublicationArtifacts.ps1 -Version $version -ReleaseDirectory "artifacts/release/$version" -ExpectedAuthenticodeStatus Unsigned

      - name: Run disposable installer smoke
        shell: pwsh
        env:
          CI: true
        run: |
          $version = '${{ steps.version.outputs.version }}'
          ./tools/Test-PactInstaller.ps1 -Version $version -SetupPath "artifacts/release/$version/pact-mission-control-$version-win-x64-setup.exe" -ZipPath "artifacts/release/$version/pact-mission-control-$version-win-x64.zip" -WorkingDirectory "$env:RUNNER_TEMP/pact-installer-smoke" -ExpectedAuthenticodeStatus Unsigned

      - name: Upload validated release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pact-mission-control-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/release/${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 14
