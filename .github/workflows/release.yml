name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag in vMAJOR.MINOR.PATCH form
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Validate release tag and version
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
              throw "Release tag must have the form vMAJOR.MINOR.PATCH: $tag"
          }
          $version = $Matches.version
          [xml]$properties = Get-Content -LiteralPath Directory.Build.props -Raw
          $declared = @(
              $properties.SelectNodes('/Project/PropertyGroup/VersionPrefix') |
                  ForEach-Object { [string]$_.InnerText } |
                  Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          if ($declared.Count -ne 1 -or $declared[0] -ne $version) {
              throw "Tag version $version does not match the single VersionPrefix."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'pact-release-notes.md'
          ./tools/Get-PactReleaseNotes.ps1 `
              -Version $version `
              -ChangelogPath CHANGELOG.md `
              -OutputPath $notesPath `
              -RepositoryUrl "${{ github.server_url }}/${{ github.repository }}"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Restore local tools
        shell: pwsh
        run: dotnet tool restore --disable-parallel

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore Pact.slnx --disable-parallel --locked-mode

      - name: Build
        shell: pwsh
        run: dotnet build Pact.slnx --no-restore -m:2 -nr:false -v q -p:BuildInParallel=false

      - name: Run test projects sequentially
        shell: pwsh
        run: |
          dotnet test tests/Pact.Core.Tests/Pact.Core.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.Infrastructure.Tests/Pact.Infrastructure.Tests.csproj --no-build --no-restore -m:1 -nr:false --filter "TestCategory!=NativeIntegration" -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.Presentation.Tests/Pact.Presentation.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.App.Avalonia.Tests/Pact.App.Avalonia.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Pact.Updater.Tests/Pact.Updater.Tests.csproj --no-build --no-restore -m:1 -nr:false -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run bundled ConPTY integration tests
        shell: pwsh
        run: |
          dotnet test tests/Pact.Infrastructure.Tests/Pact.Infrastructure.Tests.csproj --no-build --no-restore -m:1 -nr:false --filter "TestCategory=NativeIntegration" -- NUnit.NumberOfTestWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate hosted-compatible gates
        shell: pwsh
        run: |
          ./tools/Invoke-NativeWebViewGate.ps1 -SelfTest
          Write-Output "Native WebView gate: NOT RUN (interactive gate)"
          ./tools/Sync-XtermAssets.ps1 -Verify
          ./tools/Test-MarkdownLinks.ps1 -SelfTest
          ./tools/Test-MarkdownLinks.ps1
          ./tests/powershell/Test-PublicTree.Tests.ps1
          ./tools/Test-PublicTree.ps1
          ./tests/powershell/PactSbom.Tests.ps1 -ModulePath ./tools/PactSbom.psm1 -TemporaryRoot ./artifacts/sbom-selftest
          ./tests/powershell/PactReleaseComposition.Tests.ps1 -ScriptPath ./tools/Complete-PactRelease.ps1 -TemporaryRoot ./artifacts/release-composition-selftest
          ./tests/powershell/PactReleaseNotes.Tests.ps1 -ScriptPath ./tools/Get-PactReleaseNotes.ps1 -TemporaryRoot ./artifacts/release-notes-selftest
          ./tests/powershell/PactInstalledSmoke.Tests.ps1 -ScriptPath ./tools/Test-PactInstaller.ps1
          ./tools/Test-WorkflowContracts.ps1 -SelfTest
          ./tools/Test-WorkflowContracts.ps1 -CiWorkflow .github/workflows/ci.yml -ReleaseWorkflow .github/workflows/release.yml

      - name: Prepare release tree
        shell: pwsh
        run: ./tools/Publish-Pact.ps1 -Version "${{ steps.version.outputs.version }}" -RepositoryUrl "${{ github.server_url }}/${{ github.repository }}" -AuthenticodeStatus Unsigned -Phase Prepare

      - name: Install pinned Inno Setup toolchain
        id: inno
        shell: pwsh
        run: |
          $compiler = ./tools/Install-InnoSetup.ps1 -DestinationDirectory "$env:RUNNER_TEMP/pact-inno-7.1.0" | Select-Object -Last 1
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Validate installer builder
        shell: pwsh
        run: ./tests/powershell/PactInstaller.Tests.ps1 -BuildScriptPath ./tools/Build-PactInstaller.ps1 -CompilerPath '${{ steps.inno.outputs.compiler }}' -DependencyCacheDirectory ./artifacts/installer-dependencies -TemporaryRoot ./artifacts/installer-selftest

      - name: Sign, package, and validate release
        id: signing
        shell: pwsh
        env:
          CI: true
          PACT_SIGNING_PFX_BASE64: ${{ secrets.PACT_SIGNING_PFX_BASE64 }}
          PACT_SIGNING_PFX_PASSWORD: ${{ secrets.PACT_SIGNING_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:PACT_SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:PACT_SIGNING_PFX_PASSWORD)
          if ($hasPfx -ne $hasPassword) {
              throw 'Both Authenticode secrets must be configured together.'
          }

          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $pfxPath = [System.IO.Path]::GetFullPath(
              (Join-Path $runnerTemp ('pact-signing-' + [Guid]::NewGuid().ToString('N') + '.pfx')))
          $runnerPrefix = $runnerTemp.TrimEnd(
              [System.IO.Path]::DirectorySeparatorChar) +
              [System.IO.Path]::DirectorySeparatorChar
          if (-not $pfxPath.StartsWith(
                  $runnerPrefix,
                  [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "PFX path escapes RUNNER_TEMP: $pfxPath"
          }

          $pfxBytes = $null
          $importedCertificatePath = $null
          try {
              $status = 'Unsigned'
              $signToolCommand = $null
              if ($hasPfx) {
                  $pfxBytes = [Convert]::FromBase64String($env:PACT_SIGNING_PFX_BASE64)
                  [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
                  $securePassword = ConvertTo-SecureString `
                      $env:PACT_SIGNING_PFX_PASSWORD `
                      -AsPlainText `
                      -Force
                  $certificate = Get-PfxCertificate `
                      -FilePath $pfxPath `
                      -Password $securePassword
                  $now = Get-Date
                  if (-not $certificate.HasPrivateKey -or
                      $certificate.NotBefore -gt $now -or
                      $certificate.NotAfter -le $now) {
                      throw 'The signing certificate must have a private key and be currently valid.'
                  }
                  $candidateCertificatePath = "Cert:\CurrentUser\My\$($certificate.Thumbprint)"
                  if (Test-Path -LiteralPath $candidateCertificatePath) {
                      throw 'The signing certificate already exists in CurrentUser/My; refusing ambiguous cleanup.'
                  }
                  $importResult = @(Import-PfxCertificate `
                      -FilePath $pfxPath `
                      -CertStoreLocation Cert:\CurrentUser\My `
                      -Password $securePassword)
                  if (Test-Path -LiteralPath $candidateCertificatePath) {
                      $importedCertificatePath = $candidateCertificatePath
                  }
                  $importedCertificate = $importResult |
                      Where-Object Thumbprint -eq $certificate.Thumbprint |
                      Select-Object -First 1
                  if ($null -eq $importedCertificate -or
                      -not $importedCertificate.HasPrivateKey) {
                      throw 'The signing certificate could not be imported with its private key.'
                  }
                  Remove-Item -LiteralPath $pfxPath -Force
                  [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
                  $pfxBytes = $null
                  $env:PACT_SIGNING_PFX_BASE64 = $null
                  $env:PACT_SIGNING_PFX_PASSWORD = $null

                  $signTool = Get-ChildItem `
                          -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
                          -Filter signtool.exe `
                          -File `
                          -Recurse |
                      Where-Object { $_.Directory.Name -eq 'x64' } |
                      Sort-Object {
                          [version]$_.Directory.Parent.Name
                      } -Descending |
                      Select-Object -First 1
                  if ($null -eq $signTool) {
                      throw 'Windows SDK signtool.exe was not found.'
                  }

                  $ownedBinaries = @(
                      Get-ChildItem -LiteralPath artifacts/publish/win-x64 -Recurse -File |
                          Where-Object {
                              $_.Name.StartsWith(
                                  'Pact.',
                                  [System.StringComparison]::Ordinal) -and
                              $_.Extension -in @('.dll', '.exe')
                          })
                  if ($ownedBinaries.Count -eq 0) {
                      throw 'No Pact-owned binaries were found for signing.'
                  }

                  foreach ($binary in $ownedBinaries) {
                      & $signTool.FullName sign `
                          /fd SHA256 `
                          /td SHA256 `
                          /tr https://timestamp.digicert.com `
                          /sha1 $certificate.Thumbprint `
                          /s My `
                          $binary.FullName
                      if ($LASTEXITCODE -ne 0) {
                          throw "signtool failed to sign $($binary.Name)."
                      }
                      & $signTool.FullName verify /pa /all $binary.FullName
                      if ($LASTEXITCODE -ne 0) {
                          throw "signtool failed to verify $($binary.Name)."
                      }
                      if ([string](Get-AuthenticodeSignature -LiteralPath $binary.FullName).Status -ne 'Valid') {
                          throw "Windows trust validation failed for $($binary.Name)."
                      }
                  }

                  $env:PACT_SIGNTOOL_PATH = $signTool.FullName
                  $env:PACT_SIGNING_CERTIFICATE_THUMBPRINT = $certificate.Thumbprint
                  $signScript = (Resolve-Path -LiteralPath tools/Sign-PactInstaller.ps1).Path
                  $pwsh = (Get-Command pwsh -CommandType Application).Source
                  $signToolCommand = ('"{0}" -NoProfile -File "{1}" $f' -f $pwsh, $signScript)
                  $status = 'Signed'
              }

              $version = '${{ steps.version.outputs.version }}'
              $publishArguments = @{
                  Version = $version
                  RepositoryUrl = "${{ github.server_url }}/${{ github.repository }}"
                  AuthenticodeStatus = $status
                  Phase = 'Finalize'
                  CompilerPath = '${{ steps.inno.outputs.compiler }}'
                  DependencyCacheDirectory = './artifacts/installer-dependencies'
              }
              if ($status -eq 'Signed') {
                  $publishArguments.SignToolCommand = $signToolCommand
              }
              ./tools/Publish-Pact.ps1 @publishArguments
              ./tools/Test-PublicationArtifacts.ps1 -Version $version -ReleaseDirectory "artifacts/release/$version" -ExpectedAuthenticodeStatus $status
              ./tools/Test-PactInstaller.ps1 -Version $version -SetupPath "artifacts/release/$version/pact-mission-control-$version-win-x64-setup.exe" -ZipPath "artifacts/release/$version/pact-mission-control-$version-win-x64.zip" -WorkingDirectory "$env:RUNNER_TEMP/pact-installer-smoke" -ExpectedAuthenticodeStatus $status
              "status=$status" >> $env:GITHUB_OUTPUT
              Write-Output "Authenticode status: $status"
          }
          finally {
              if ($null -ne $pfxBytes) {
                  [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
              }
              if ($null -ne $importedCertificatePath -and
                  (Test-Path -LiteralPath $importedCertificatePath)) {
                  Remove-Item -LiteralPath $importedCertificatePath -Force
              }
              if (Test-Path -LiteralPath $pfxPath) {
                  Remove-Item -LiteralPath $pfxPath -Force
              }
          }

      - name: Attest release checksums
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-checksums: artifacts/release/${{ steps.version.outputs.version }}/SHA256SUMS.txt

      - name: Attest ZIP with SPDX SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: artifacts/release/${{ steps.version.outputs.version }}/pact-mission-control-${{ steps.version.outputs.version }}-win-x64.zip
          sbom-path: artifacts/release/${{ steps.version.outputs.version }}/manifest.spdx.json

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $files = @(
              Get-ChildItem -LiteralPath "artifacts/release/$version" -File |
                  ForEach-Object FullName
          )
          & gh release create $env:RELEASE_TAG @files `
              --verify-tag `
              --notes-file $env:RELEASE_NOTES `
              --title "PACT:> Mission Control $version"
          if ($LASTEXITCODE -ne 0) {
              throw "gh release create failed with exit code $LASTEXITCODE."
          }
